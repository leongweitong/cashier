
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机场门店收银协助工具</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .calculate {
      background: #176b43;
      color: white;
    }

    .copy {
      background: #e8e8e8;
      color: #222;
    }

    .entries {
      margin-top: 20px;
      padding: 15px;
      background: #f0f7f1;
      border-radius: 10px;
      line-height: 1.9;
    }

    .entry {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #ddd;
      padding: 4px 0;
    }

    .error {
      color: #c62828;
      margin-top: 12px;
    }

    .note {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h2>机场门店收银协助工具</h2>

    <label for="a">机场机器当前金额</label>
    <input
      id="a"
      type="text"
      inputmode="decimal"
      placeholder="例如：8500.25"
      autocomplete="off"
    >

    <label for="b">当天总营业额</label>
    <input
      id="b"
      type="text"
      inputmode="decimal"
      placeholder="例如：12000.00"
      autocomplete="off"
    >

    <button class="calculate" onclick="calculate()">
      计算分笔输入清单
    </button>

    <div id="error" class="error"></div>
    <div id="result"></div>
  </div>

  <script>
    const SERVICE_RATE = 0.10;
    const GST_RATE = 0.09;
    const MAX_ENTRY_CENTS = 99900;

    let currentEntries = [];

    // 验证金额并转换成整数分
    function parseMoney(value) {
      const text = value.trim();

      if (!/^\d+(\.\d{1,2})?$/.test(text)) {
        return null;
      }

      const amount = Number(text);
      const cents = Math.round(amount * 100);

      if (!Number.isFinite(amount) ||
          !Number.isSafeInteger(cents)) {
        return null;
      }

      return cents;
    }

    // 计算每笔输入金额加上服务费和 GST 后的实际金额
    function calculateActual(inputCents) {
      const service = Math.round(inputCents * SERVICE_RATE);
      const subtotal = inputCents + service;
      const gst = Math.round(subtotal * GST_RATE);

      return subtotal + gst;
    }

    // 每笔最多 999.00
    function splitAmount(totalCents) {
      const entries = [];
      let remaining = totalCents;

      while (remaining > 0) {
        const amount = Math.min(MAX_ENTRY_CENTS, remaining);
        entries.push(amount);
        remaining -= amount;
      }

      return entries;
    }

    // 找出最接近目标差额的输入金额
    function findBestEntries(differenceCents) {
      const estimate = Math.round(
        differenceCents / ((1 + SERVICE_RATE) * (1 + GST_RATE))
      );

      const count = Math.ceil(estimate / MAX_ENTRY_CENTS);
      const radius = 3 * (count + 1) + 10;

      let best = null;

      for (
        let candidate = Math.max(0, estimate - radius);
        candidate <= estimate + radius;
        candidate++
      ) {
        const entries = splitAmount(candidate);
        const actual = entries.reduce(
          (sum, entry) => sum + calculateActual(entry),
          0
        );

        const error = Math.abs(differenceCents - actual);

        if (
          best === null ||
          error < best.error ||
          (error === best.error && candidate < best.total)
        ) {
          best = { total: candidate, entries, error };
        }

        if (error === 0) break;
      }

      return best;
    }

    // 主计算程序
    function calculate() {
      const a = parseMoney(document.getElementById("a").value);
      const b = parseMoney(document.getElementById("b").value);
      const errorElement = document.getElementById("error");
      const resultElement = document.getElementById("result");

      errorElement.textContent = "";
      resultElement.innerHTML = "";
      currentEntries = [];

      if (a === null || b === null) {
        errorElement.textContent =
          "请输入有效金额，最多两位小数，例如 8500.25。";
        return;
      }

      const difference = b - a;

      if (difference < 0) {
        errorElement.textContent =
          "机器金额已高于当天总营业额，请检查输入。";
        return;
      }

      if (difference === 0) {
        resultElement.innerHTML =
          '<div class="entries">金额已经相等，无需输入。</div>';
        return;
      }

      const best = findBestEntries(difference);
      currentEntries = best.entries;

      const entriesHtml = currentEntries.map((entry, index) => `
        <div class="entry">
          <span>第 ${index + 1} 笔</span>
          <strong>${(entry / 100).toLocaleString("en-SG", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          })}</strong>
        </div>
      `).join("");

      resultElement.innerHTML = `
        <div class="entries">
          <strong>分笔输入清单（每笔最多 $999.00）</strong>
          <p>共 ${currentEntries.length} 笔</p>
          ${entriesHtml}
        </div>

        <p class="note">
          请按清单逐笔输入，并以机器实际显示金额及公司收银流程为准。
        </p>
      `;
    }

  </script>
</body>
</html>
